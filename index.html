        body { font-family: 'Inter', sans-serif; background-color: #f0f4f8; direction: ltr; }

        .chat-message.model { background:#fff; color:#0f172a; align-self:flex-start; border-radius:18px 18px 18px 4px; box-shadow:0 8px 30px rgba(99,102,241,0.08); border:1px solid rgba(15,23,42,0.04); font-weight:500; font-size:1.1rem; }
        .typing-cursor { display:inline-block; width:8px; height:1.05em; margin-left:6px; vertical-align:middle; background:#0f172a; border-radius:2px; animation: blink 1s steps(2,end) infinite; }
        @keyframes blink { 0%,50% { opacity:1 } 51%,100% { opacity:0 } }

        .wrong-answer { color: #dc2626; font-weight: bold; margin-top: 0.5rem; }

<body class="bg-gray-100 flex items-start justify-center min-h-screen p-4 relative">
    <div class="background-image"></div>
    <div class="container text-center">
        <h1 class="text-3xl font-bold text-gray-800 mb-2">Study App</h1>
        <div id="drop-area" class="mb-4 p-5 border-2 border-dashed border-gray-300 rounded-lg cursor-pointer hover:border-blue-500 relative">
            <div class="file-input-wrapper">
                <input type="file" id="pdf-file-input" accept="application/pdf,.pdf"/>
            </div>
            <p class="text-gray-500"><span class="font-bold text-blue-500">Drag & Drop file here</span> or click to upload</p>
            <p id="file-name" class="text-sm text-gray-600 mt-2"></p>
        </div>
        <div class="mb-4 flex space-x-3 items-end">
            <div class="flex-1">
                <label for="task-select" class="block text-left text-sm font-medium text-gray-700 mb-1">Select Task</label>
                <select id="task-select" class="w-full beautiful-input">
                    <option value="summary">Summary</option>
                    <option value="mcq">Multiple Choice Questions (MCQ)</option>
                    <option value="saq">Short Answer Questions (SAQ)</option>
                    <option value="highlights">Key Highlights</option>
                    <option value="flashcards">Flashcards</option>
                    <option value="explanation-ar">Explanation in Arabic</option>
                    <option value="comparison">Compare Concepts</option>
                </select>
            </div>
            <div id="mcq-input-container" class="flex-1 hidden">
                <label for="mcq-count" class="block text-left text-sm font-medium text-gray-700 mb-1">Number of Questions</label>
                <input type="number" id="mcq-count" value="5" min="1" max="20" class="w-full beautiful-input"/>
            </div>
            <div id="saq-input-container" class="flex-1 hidden">
                <label for="saq-count" class="block text-left text-sm font-medium text-gray-700 mb-1">Number of Questions</label>
                <input type="number" id="saq-count" value="5" min="1" max="20" class="w-full beautiful-input"/>
            </div>
            <div id="comparison-input-container" class="flex-1 hidden">
                <label for="comparison-terms" class="block text-left text-sm font-medium text-gray-700 mb-1">Concepts to Compare</label>
                <input type="text" id="comparison-terms" placeholder="Enter terms separated by vs or comma" class="w-full beautiful-input"/>
            </div>
        </div>
        <div class="mb-4 flex items-center">
            <input type="checkbox" id="skip-intro" checked class="mr-2 h-4 w-4 text-blue-600 focus:ring-blue-500 border-gray-300 rounded">
            <label for="skip-intro" class="text-sm text-gray-700">Skip introductory content (professor info, dates, etc.)</label>
        </div>
        <div class="mb-4 flex items-center">
            <input type="checkbox" id="use-ocr" class="mr-2 h-4 w-4 text-blue-600 focus:ring-blue-500 border-gray-300 rounded">
            <label for="use-ocr" class="text-sm text-gray-700">Use OCR for image-based text extraction (recommended for scanned PDFs)</label>
        </div>
        <button id="process-button" class="w-full beautiful-btn btn-primary mb-3">Process</button>
        <div id="loading-area" class="flex justify-center items-center mt-2 hidden"><div class="loading-spinner"></div><p class="ml-3 text-blue-600 font-medium">Processing...</p></div>
        <div id="ocr-progress" class="ocr-progress hidden">
            <p class="progress-text" id="ocr-status">Extracting text from images...</p>
            <div class="progress-bar">
                <div class="progress-fill" id="ocr-progress-bar" style="width: 0%"></div>
            </div>
            <p class="progress-text" id="ocr-page-info">Page 0 of 0</p>
        </div>
        <div id="result-area" class="mt-4 text-left bg-gray-50 p-4 rounded-lg border hidden">
            <div id="result-text" class="whitespace-pre-wrap"></div>
        </div>
        <button id="download-pdf-btn" class="w-full beautiful-btn btn-primary mt-3 hidden">Download</button>
        <div class="mt-6 pt-6 border-t border-gray-200">
            <h2 class="text-xl font-bold text-gray-700 mb-4">Instant Explanation</h2>
            <div class="flex space-x-2">
                <input id="explanation-input" type="text" placeholder="Enter a term or concept..." class="flex-1 beautiful-input" dir="auto"/>
                <button id="explain-button" class="beautiful-btn btn-success">Explain</button>
            </div>
            <div id="explanation-result" class="mt-4 text-left hidden">
                <div id="explanation-text" class="whitespace-pre-wrap"></div>
                <div id="explanation-status" class="explanation-status hidden">
                    <div class="loading-spinner"></div>
                    <span>Generating concise explanation...</span>
                </div>
            </div>
        </div>
        <div id="chat-container" class="mt-6 bg-gray-50 rounded-lg border hidden">
            <h2 class="text-xl font-bold text-gray-700 p-4 border-b">Chat with the AI</h2>
            <div id="chat-messages" class="p-4 h-80 overflow-y-auto"></div>
            <div class="p-4 flex space-x-2 border-t">
                <input id="chat-input" type="text" placeholder="Type your message..." class="flex-1 beautiful-input" dir="auto"/>
                <button id="send-button" class="beautiful-btn btn-primary">Send</button>
                <button id="stop-button" class="beautiful-btn btn-danger hidden">Stop</button>
            </div>
        </div>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.11.338/pdf.min.js"></script>

    <script>
        const GEMINI_MODEL = "gemini-3.8-flash"; // update here if Google retires the model again
        // "low" thinking = much faster responses (3.8 Flash does not support "minimal")
        const GEN_CONFIG = { thinkingConfig: { thinkingLevel: "low" } };
        
        // Retries when Google says "high demand" (503/429), then falls back to another model
        const FALLBACK_MODELS = ["gemini-3.6-flash"];
        async function geminiFetch(url, options) {
            const models = [GEMINI_MODEL, ...FALLBACK_MODELS];
            let response;
            for (const model of models) {
                const modelUrl = url.replace(/models\/[^:]+:/, `models/${model}:`);
                for (let attempt = 0; attempt < 3; attempt++) {
                    response = await fetch(modelUrl, options);
                    if (![429, 500, 503].includes(response.status)) return response;
                    await new Promise(r => setTimeout(r, 1500 * (attempt + 1)));
                }
            }
            return response;
        }
        const apiKey = "AQ.Ab8RN6LVe75ODA48v6PsZfBVg7L9afjbMZ-KQfdfdWkXkh3M0A";
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.11.338/pdf.worker.min.js';
        // DOM
        const fileInput = document.getElementById('pdf-file-input');
        const dropArea = document.getElementById('drop-area');
        const fileNameDisplay = document.getElementById('file-name');
        const taskSelect = document.getElementById('task-select');

        const comparisonInputContainer = document.getElementById('comparison-input-container');
        const mcqCountInput = document.getElementById('mcq-count');
        const saqCountInput = document.getElementById('saq-count');
        const comparisonTermsInput = document.getElementById('comparison-terms');
        const processButton = document.getElementById('process-button');
        const loadingArea = document.getElementById('loading-area');
        const resultArea = document.getElementById('result-area');
        const resultText = document.getElementById('result-text');
        const chatContainer = document.getElementById('chat-container');
        const chatMessages = document.getElementById('chat-messages');
        const chatInput = document.getElementById('chat-input');
        const sendButton = document.getElementById('send-button');
        const stopButton = document.getElementById('stop-button');
        const explainButton = document.getElementById('explain-button');
        const explanationInput = document.getElementById('explanation-input');
        const explanationResult = document.getElementById('explanation-result');
        const explanationText = document.getElementById('explanation-text');
        const explanationStatus = document.getElementById('explanation-status');
        const skipIntroCheckbox = document.getElementById('skip-intro');
        const useOcrCheckbox = document.getElementById('use-ocr');
        const ocrProgress = document.getElementById('ocr-progress');
        const ocrStatus = document.getElementById('ocr-status');
        const ocrProgressBar = document.getElementById('ocr-progress-bar');
        const ocrPageInfo = document.getElementById('ocr-page-info');
        const downloadPdfBtn = document.getElementById('download-pdf-btn');
        // state
        let fileContent = "";
        let chatHistory = [];
        let isProcessing = false;
        let isTyping = false;
        let abortController = null;
        let isTypingAnimation = false;
        let typingTimeoutIds = [];
        let typingElement = null;
        let typingText = '';
        let typingIndex = 0;

        // ✅ دالة الكشف عن النص العربي (RTL)
        function isArabicText(text) {
            const arabicPattern = /[\u0600-\u06FF\u0750-\u077F\u08A0-\u08FF\uFB50-\uFDFF\uFE70-\uFEFF]/;
            return arabicPattern.test(text);
        }

        // ✅ Add missing typeIntoElement function
        async function typeIntoElement(element, text, speed = 18) {
            element.textContent = '';
            for (let i = 0; i < text.length; i++) {
                element.textContent += text[i];
                await new Promise(resolve => setTimeout(resolve, speed));
            }
        }

        // ✅ Add expansions object for acronyms
        const expansions = {
            "T3": "Triiodothyronine",
            "T4": "Thyroxine",
            "TSH": "Thyroid Stimulating Hormone",
            "FT4": "Free Thyroxine",
            "TFT": "Thyroid Function Test",
            "HPT": "Hypothalamic-Pituitary-Thyroid",
            "TRH": "Thyrotropin-Releasing Hormone",
            "TRE": "Thyroid Response Element",
            "DIO2": "Type 2 Deiodinase",
            "RT3": "Reverse T3",
            "TBG": "Thyroxine-Binding Globulin",
            "TPO": "Thyroid Peroxidase",
            "TG": "Thyroglobulin",
            "TSHR": "Thyroid Stimulating Hormone Receptor",
            "TRAbs": "Thyrotropin Receptor Antibodies",
            "TAB": "Thyroid Autoantibodies",
            "TNF": "Tumor Necrosis Factor",
            "IL": "Interleukin",
            "IFN": "Interferon",
            "GD": "Graves' Disease",
            "HT": "Hashimoto's Thyroiditis",
            "TAO": "Thyroid-Associated Orbitopathy",
            "TFTs": "Thyroid Function Tests"
        };

        function toTitleCase(str) {
            return str.replace(/\w\S*/g, function(txt) {
                return txt.charAt(0).toUpperCase() + txt.substr(1).toLowerCase();
            });
        }

        function cleanModelText(text) {
            return text.replace(/\*\*(.*?)\*\*/g, '$1').replace(/\*(.*?)\*/g, '$1').trim();
        }

        // ✅ Append user message instantly (مع دعم العربية)
        function appendMessage(role, text) {
            try {
                const div = document.createElement('div');
                div.classList.add('chat-message');
                
                // ضبط المحاذاة والاتجاه حسب اللغة
                if (isArabicText(text)) {
                    div.style.direction = 'rtl';
                    div.style.textAlign = 'right';
                } else {
                    div.style.direction = 'ltr';
                    div.style.textAlign = 'left';
                }

                if (role === 'user') {
                    div.classList.add('user');
                    div.style.alignSelf = 'flex-end';
                    div.textContent = text.trim();
                } else {
                    div.classList.add('model');
                    div.style.alignSelf = 'flex-start';
                    div.textContent = text.trim();
                }
                chatMessages.appendChild(div);
                chatMessages.scrollTop = chatMessages.scrollHeight;
            } catch(e) { console.error('appendMessage error:', e); }
        }

        // ✅ Append AI message with typing animation (مع دعم العربية)
        function appendModelTyping(fullText) {
            return new Promise((resolve) => {
                isTypingAnimation = true;
                isTyping = true;
                
                stopButton.classList.remove('hidden');
                sendButton.classList.add('hidden');
                
                const div = document.createElement('div');
                div.classList.add('chat-message','model');
                div.style.alignSelf = 'flex-start';
                
                // ضبط الاتجاه والمحاذاة حسب اللغة
                if (isArabicText(fullText)) {
                    div.style.direction = 'rtl';
                    div.style.textAlign = 'right';
                } else {
                    div.style.direction = 'ltr';
                    div.style.textAlign = 'left';
                }
                
                const textSpan = document.createElement('span');
                textSpan.className = 'typing-text';
                div.appendChild(textSpan);
                const cursor = document.createElement('span');
                cursor.className = 'typing-cursor';
                div.appendChild(cursor);
                
                const cleaned = fullText.trim();
                chatMessages.appendChild(div);
                chatMessages.scrollTop = chatMessages.scrollHeight;
                
                typingElement = textSpan;
                typingText = cleaned;
                typingIndex = 0;
                typingTimeoutIds = [];
                
                const speed = 18;
                
                function step() {
                    if (!isTypingAnimation || typingIndex >= cleaned.length) {
                        if (cursor && cursor.parentNode) cursor.parentNode.removeChild(cursor);
                        textSpan.textContent = cleaned;
                        chatMessages.scrollTop = chatMessages.scrollHeight;
                        
                        stopButton.classList.add('hidden');
                        sendButton.classList.remove('hidden');
                        
                        isTypingAnimation = false;
                        isTyping = false;
                        resolve();
                        return;
                    }
                    
                    textSpan.textContent = textSpan.textContent + cleaned[typingIndex];
                    typingIndex++;
                    chatMessages.scrollTop = chatMessages.scrollHeight;
                    
                    const timeoutId = setTimeout(step, speed);
                    typingTimeoutIds.push(timeoutId);
                }
                
                step();
            });
        }

        // ✅ دالة إيقاف الكتابة
        function stopTyping() {
            if (isTypingAnimation) {
                typingTimeoutIds.forEach(id => clearTimeout(id));
                typingTimeoutIds = [];
                
                if (typingElement && typingText && typingIndex < typingText.length) {
                    const remainingText = typingText.substring(typingIndex);
                    typingElement.textContent += remainingText;
                    
                    const cursor = typingElement.parentElement.querySelector('.typing-cursor');
                    if (cursor && cursor.parentNode) {
                        cursor.parentNode.removeChild(cursor);
                    }
                }
                
                stopButton.classList.add('hidden');
                sendButton.classList.remove('hidden');
                
                isTypingAnimation = false;
                isTyping = false;
            }
            
            if (abortController) {
                abortController.abort();
                abortController = null;
            }
        }

                const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent?key=${apiKey}`;
                const payload = {
                    contents: [
                        { role: 'user', parts: [{ text: systemPrompt }] },
                        ...chatHistory
                    ]
                };
                
                const response = await geminiFetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ ...payload, generationConfig: GEN_CONFIG }),
                    signal: abortController.signal
                });
                
                const result = await response.json();

        function handleFile(file) {

        let extractionPromise = null;
        function processPDF(file) {
            fileContent = "";
            extractionPromise = (async () => {
                const setStatus = (msg) => { fileNameDisplay.textContent = `Selected File: ${file.name}${msg ? ' — ' + msg : ''}`; };
                try {
                    setStatus('reading file...');
                    const buffer = await new Promise((resolve, reject) => {
                        const reader = new FileReader();
                        reader.onload = () => resolve(reader.result);
                        reader.onerror = () => reject(reader.error || new Error('Could not read the file from the device'));
                        reader.readAsArrayBuffer(file);
                    });
                    setStatus('opening PDF...');
                    let pdf;
                    try {
                        pdf = await pdfjsLib.getDocument({ data: new Uint8Array(buffer.slice(0)) }).promise;
                    } catch (e1) {
                        console.warn('PDF worker failed, retrying without worker', e1);
                        pdf = await pdfjsLib.getDocument({ data: new Uint8Array(buffer.slice(0)), disableWorker: true }).promise;
                    }
                    let text = '';
                    const useOCR = useOcrCheckbox.checked;
                    if (useOCR) {
                        ocrProgress.classList.remove('hidden');
                        ocrStatus.textContent = 'Extracting text from images...';
                    }
                    for (let i = 1; i <= pdf.numPages; i++) {
                        if (useOCR) {
                            ocrPageInfo.textContent = `Page ${i} of ${pdf.numPages}`;
                            ocrProgressBar.style.width = `${(i / pdf.numPages) * 100}%`;
                        } else {
                            setStatus(`extracting page ${i}/${pdf.numPages}`);
                        }
                        const page = await pdf.getPage(i);
                        text += (await extractTextFromPage(page, useOCR)) + '\n';
                    }
                    if (useOCR) ocrProgress.classList.add('hidden');
                    if (skipIntroCheckbox.checked) text = filterIrrelevantContent(text);
                    if (!text.trim()) throw new Error('No text found in this PDF. It may be scanned - tick the OCR option and upload it again.');
                    fileContent = text;
                    setStatus('✅ ready');
                } catch (err) {
                    console.error('PDF error:', err);
                    ocrProgress.classList.add('hidden');
                    fileContent = "";
                    setStatus('❌ ' + (err && err.message ? err.message : err));
                }
            })();
            return extractionPromise;
        }
        async function extractTextFromPage(page, useOCR) {
            if (!useOCR) {
                try {
                    const content = await page.getTextContent();
                    return content.items.map(item => item.str).join(' ');
                } catch (error) {
                    console.error("Error extracting text:", error);
                    return "";
                }
            } else {
                try {
                    const viewport = page.getViewport({ scale: 2.0 });
                    const canvas = document.createElement('canvas');
                    const context = canvas.getContext('2d');
                    canvas.height = viewport.height;
                    canvas.width = viewport.width;
                    await page.render({
                        canvasContext: context,
                        viewport: viewport
                    }).promise;
                    const { data } = await Tesseract.recognize(canvas, 'eng', { logger: m => {} });
                    return data.text;
                } catch (error) {
                    console.error("OCR error:", error);
                    try {
                        const content = await page.getTextContent();
                        return content.items.map(item => item.str).join(' ');
                    } catch (e) {
                        return "";
                    }
                }
            }
        }
        function filterIrrelevantContent(text) {
            const lines = text.split('\n');
            const filteredLines = [];
            const irrelevantPatterns = [
                /office hours?/i,
                /prof(\.|essor)/i,
                /lecturer/i,
                /instructor/i,
                /contact information/i,
                /email/i,
                /phone/i,
                /@.*\./i,
                /monday|tuesday|wednesday|thursday|friday|saturday|sunday/i,
                /\d{1,2}[:.]\d{2}\s*(AM|PM)/i,
                /academic hours/i,
                /module coordinator/i,
                /course outline/i,
                /syllabus/i,
                /schedule/i
            ];
            for (const line of lines) {
                let isIrrelevant = irrelevantPatterns.some(p => p.test(line));
                if (!isIrrelevant && line.trim().length > 10) {
                    filteredLines.push(line);
                }
            }
            return filteredLines.join('\n');
        }

        // ✅ دالة عرض MCQ المعدلة بالكامل (بدون خيار خامس)
        function renderMCQ(text) {
            resultText.innerHTML = "";
            const blocks = text.split(/(?:Question:)/).filter(b => b.trim());
            blocks.forEach(block => {
                const div = document.createElement('div');
                div.classList.add('mcq-question');
                const lines = block.trim().split("\n").map(l => l.trim()).filter(l => l);
                
                const questionLine = lines[0] || 'Question';
                const qEl = document.createElement('p');
                qEl.classList.add('font-bold', 'mb-2');
                qEl.textContent = questionLine;
                div.appendChild(qEl);

                let options = [];
                let correctAnswerText = '';

                lines.forEach(line => {
                    if (/^(Correct Answer)/i.test(line)) {
                        const match = line.match(/Correct Answer:\s*([A-D])/i);
                        if (match) correctAnswerText = match[1].toUpperCase();
                        return;
                    }

                    if (line === questionLine) return;

                    const optMatch = line.match(/^([A-D])\)?\s*(.*)$/i);
                    if (optMatch) {
                        options.push({
                            letter: optMatch[1].toUpperCase(),
                            text: optMatch[2]
                        });
                    }
                });

                options = options.slice(0, 4);
                
                const shuffledOptions = [...options].sort(() => Math.random() - 0.5);
                
                let newCorrectLetter = '';
                shuffledOptions.forEach((opt, index) => {
                    const originalLetter = opt.letter;
                    if (originalLetter === correctAnswerText) {
                        newCorrectLetter = String.fromCharCode(65 + index);
                    }
                });

                shuffledOptions.forEach((opt, index) => {
                    const letter = String.fromCharCode(65 + index);
                    const btn = document.createElement("button");
                    btn.classList.add("mcq-option");
                    btn.textContent = `${letter}) ${opt.text}`;
                    btn.type = 'button';
                    btn.addEventListener("click", () => {
                        if (div.dataset.answered === 'true') return;
                        div.dataset.answered = 'true';
                        const allBtns = Array.from(div.querySelectorAll('.mcq-option'));
                        allBtns.forEach(b => { b.disabled = true; });
                        if (letter === newCorrectLetter) {
                            btn.classList.add("bg-green-200");
                            const correctSpan = document.createElement('span');
                            correctSpan.className = 'correct-answer';
                            correctSpan.textContent = ' ✔ Correct';
                            btn.appendChild(correctSpan);
                        } else {
                            btn.classList.add("bg-red-200");
                            const wrongSpan = document.createElement('span');
                            wrongSpan.className = 'wrong-answer';
                            wrongSpan.textContent = ' ❌ Wrong';
                            btn.appendChild(wrongSpan);
                            const correctBtn = allBtns.find(b => b.textContent.startsWith(`${newCorrectLetter})`));
                            if (correctBtn) {
                                correctBtn.classList.add("bg-green-200");
                                const correctSpan = document.createElement('span');
                                correctSpan.className = 'correct-answer';
                                correctSpan.textContent = ' ✔ Correct';
                                correctBtn.appendChild(correctSpan);
                            }
                        }
                    });
                    div.appendChild(btn);
                });

                const explainBtn = document.createElement("button");
                explainBtn.classList.add("mt-3", "px-3", "py-1", "bg-yellow-500", "text-white", "rounded", "hover:bg-yellow-600");
                explainBtn.textContent = "Explain Answer";
                explainBtn.addEventListener("click", () => {
                    const correctOption = shuffledOptions.find(opt => 
                        String.fromCharCode(65 + shuffledOptions.indexOf(opt)) === newCorrectLetter
                    );
                    const correctAnswerText = correctOption ? correctOption.text : '';
                    explainQuestion(questionLine, shuffledOptions, correctAnswerText, div);
                });
                div.appendChild(explainBtn);
                resultText.appendChild(div);
            });
        }

        function renderFlashcards(text){
            resultText.innerHTML="";
            const lines = text.split('\n').filter(line => line.trim() !== '');
            for(let i=0; i<lines.length; i++) {
                let line = lines[i].trim();
                if (!line) continue;
                let questionMatch = line.match(/^Question:\s*(.+)$/i);
                let answerMatch = null;
                if (questionMatch && i+1 < lines.length) {
                    let nextLine = lines[i+1].trim();
                    answerMatch = nextLine.match(/^Answer:\s*(.+)$/i);
                    if (answerMatch) i++;
                }
                if (!questionMatch || !answerMatch) {
                    let parts = line.split(':');
                    if (parts.length >= 2) {
                        let firstPart = parts[0].trim().toLowerCase();
                        if (firstPart === 'question' || firstPart === 'q') {
                            questionMatch = [null, parts.slice(1).join(':').trim()];
                        } else if (firstPart === 'answer' || firstPart === 'a') {
                            answerMatch = [null, parts.slice(1).join(':').trim()];
                        }
                    }
                }
                if (questionMatch && answerMatch) {
                    const div = document.createElement('div');
                    div.classList.add('flashcard');
                    const qEl = document.createElement('p');
                    qEl.classList.add('flashcard-question');
                    qEl.textContent = questionMatch[1];
                    div.appendChild(qEl);
                    const aEl = document.createElement('p');
                    aEl.classList.add('flashcard-answer');
                    aEl.textContent = answerMatch[1];
                    div.appendChild(aEl);
                    resultText.appendChild(div);
                }
                else if (questionMatch) {
                    const div = document.createElement('div');
                    div.classList.add('flashcard');
                    const qEl = document.createElement('p');
                    qEl.classList.add('flashcard-question');
                    qEl.textContent = questionMatch[1];
                    div.appendChild(qEl);
                    const aEl = document.createElement('p');
                    aEl.classList.add('flashcard-answer');
                    aEl.textContent = '(Answer not detected — please check your PDF)';
                    div.appendChild(aEl);
                    resultText.appendChild(div);
                }
            }
            if (resultText.children.length === 0 && lines.length > 0) {
                const fullText = lines.join(' ');
                const dividerIndex = fullText.indexOf('\n');
                if (dividerIndex > 0) {
                    const question = fullText.substring(0, dividerIndex).trim();
                    const answer = fullText.substring(dividerIndex + 1).trim();
                    if (question && answer) {
                        const div = document.createElement('div');
                        div.classList.add('flashcard');
                        const qEl = document.createElement('p');
                        qEl.classList.add('flashcard-question');
                        qEl.textContent = question;
                        div.appendChild(qEl);
                        const aEl = document.createElement('p');
                        aEl.classList.add('flashcard-answer');
                        aEl.textContent = answer;
                        div.appendChild(aEl);
                        resultText.appendChild(div);
                    }
                }
            }
        }
        
        async function explainQuestion(questionText, options, correctAnswerText, div) {
            const prompt = `Based on the document content, explain why "${correctAnswerText}" is the correct answer for this question:
            
Question: ${questionText}

Provide a brief explanation (2-3 sentences) focusing on the educational content from the lecture. Answer in plain text only.`;

            let explanation = div.querySelector(".explanation-block");
            if (!explanation) { 
                explanation = document.createElement("div"); 
                explanation.classList.add("explanation-block", "text-blue-700", "mt-3", "p-3", "bg-blue-50", "rounded"); 
                div.appendChild(explanation); 
            }
            explanation.innerHTML = "";
            
            try {
                const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent?key=${apiKey}`;
                const payload = { 
                    contents: [{ 
                        parts: [{ 
                            text: `Document content:\n${fileContent}\n\n${prompt}` 
                        }] 
                    }] 
                };
                
                explanation.textContent = "⏳ Generating explanation from lecture content...";
                const response = await geminiFetch(apiUrl, { 
                    method: 'POST', 
                    headers: {'Content-Type': 'application/json'}, 
                    body: JSON.stringify({ ...payload, generationConfig: GEN_CONFIG }) 
                });
                const result = await response.json();
                if (!response.ok || result.error) throw new Error(result?.error?.message || ('HTTP ' + response.status));
                const generatedText = result?.candidates?.[0]?.content?.parts?.[0]?.text || 'No explanation available.';
                
                await typeIntoElement(explanation, generatedText, 25);
            } catch(e) { 
                explanation.textContent = `Error generating explanation: ${e.message}`; 
            }
        }
        
        explainButton.addEventListener('click', async () => {
            const termRaw = explanationInput.value.trim();
            if (!termRaw || isProcessing) return;
            isProcessing = true;
            explanationStatus.classList.remove('hidden');
            explanationResult.classList.remove('hidden');
            explanationText.textContent = '';
            const termUpper = termRaw.toUpperCase();
            const isAcronymLike = /^[A-Z]{2,6}$/.test(termUpper);
            if (isAcronymLike && expansions[termUpper]) {
                const full = toTitleCase(expansions[termUpper]);
                explanationText.innerHTML = `<div class="expansion-highlight">${full} (${termUpper})</div>`;
            } else {
                explanationText.innerHTML = `<div class="expansion-highlight">${termRaw}</div>`;
            }
            try {
                const prompt = `Using the provided document for context (if available), produce a VERY SHORT plain-text explanation for the term "${termRaw}".
Requirements:
- Output plain text only (no markdown).
- Start with a clear definition in one sentence (this will be shown as the highlighted main point).
- Follow with up to 2 very brief bullet points (if needed) — each bullet short.
- Keep the entire explanation under 50 words.
- If the term is an acronym, also provide the full expansion (Full Name) in parentheses after the definition.
Document:
${fileContent || "[No document provided]"}`;
                const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent?key=${apiKey}`;
                const payload = { contents: [{ parts: [{ text: prompt }] }] };
                const response = await geminiFetch(apiUrl, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ ...payload, generationConfig: GEN_CONFIG }) });
                const result = await response.json();
                if (!response.ok || result.error) throw new Error(result?.error?.message || ('HTTP ' + response.status));
                const gen = result?.candidates?.[0]?.content?.parts?.[0]?.text || '';
                explanationStatus.classList.add('hidden');
                const cleaned = cleanModelText(gen);
                let highlightLine = null;
                let restLines = [];
                if (isAcronymLike && expansions[termUpper]) {
                    highlightLine = `${toTitleCase(expansions[termUpper])} (${termUpper})`;
                    const lines = cleaned.split('\n').map(l=>l.trim()).filter(Boolean);
                    for (const ln of lines) {
                        const simpleLn = ln.replace(/\s+/g,' ').toLowerCase();
                        const expSimple = expansions[termUpper].replace(/\s+/g,' ').toLowerCase();
                        if (simpleLn.includes(expSimple) || simpleLn.includes(termUpper.toLowerCase())) continue;
                        else restLines.push(ln);
                    }
                } else {
                    const lines = cleaned.split('\n').map(l=>l.trim()).filter(Boolean);
                    if (lines.length > 0) {
                        highlightLine = lines[0];
                        restLines = lines.slice(1);
                    } else {
                        highlightLine = cleaned;
                        restLines = [];
                    }
                }
                let html = `<div class="expansion-highlight">${highlightLine}</div>`;
                if (restLines.length > 0) {
                    html += `<ul class="explanation-key-points">`;
                    for (let i=0; i<Math.min(2, restLines.length); i++){
                        html += `<li>${restLines[i]}</li>`;
                    }
                    html += `</ul>`;
                }
                explanationText.innerHTML = html;
            } catch (e) {
                explanationStatus.classList.add('hidden');
                explanationText.textContent = `Error: ${e?.message || e}`;
            } finally {
                isProcessing = false;
            }
        });
        // Make jsPDF global
        window.jsPDF = window.jspdf.jsPDF;
    </script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('service-worker.js').catch(err => console.warn('SW failed', err));
            });
        }
    </script>
